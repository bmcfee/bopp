[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bopp"
dynamic = ["version"]
description = "Bounded Observation Payload Protocol"
dependencies = [
    "msgspec>=0.19.0",
    "mir_eval>=0.8.0",
    "numpy>=2.3.0",
    "polars>=2.0.0",
    "tomli-w>=1.2.0",
]
requires-python = ">=3.13"

[project.optional-dependencies]
dataframe = [
    "pandas>=2.3.0",
    "pyarrow>=18.1.0",
]

[dependency-groups]
docs = [
    "sphinx>=8.2.0",
    "numpydoc>=1.9.0",
    "pydata-sphinx-theme>=0.16.1",
    "json-schema-for-humans>=1.0.4",
    "myst-parser>=4.0.1",
    "linkify-it-py>=2.1.0",
]
test = [
    "check-jsonschema>=0.31.0",
    "pytest>=9.0.0",
    "pytest-cov>=6.1.0",
    "pandas>=2.3.0",
    "pyarrow>=18.1.0",
    "hatch>=1.18.0",
]
benchmark = [
    "pytest-benchmark>=5.2.0",
    "jams>=0.3.5",
    "tabulate>=0.10.0",
]
lint = [
    { include-group = "test" },
    { include-group = "docs" },
    "codespell>=2.4.0",
    "mypy>=1.15.0",
    "ruff>=0.17.0",
    "pandas-stubs>=2.2.3.241126",
    "pyarrow-stubs>=17.12",
]

[tool.ruff.lint]
ignore = [
    "UP040", # Type alias using TypeAliasType is tested specifically in test_registry
    "UP047", # Generic function TypeVar syntax
]

[tool.hatch.version]
path = "bopp/_version.py"

[tool.pytest.ini_options]
addopts = "--cov=bopp --cov-report=term-missing --cov-branch --cov-report=xml"
testpaths = ["tests"]

[tool.codespell]
skip = "*.msgpack,*.msgpack.gz,*.gz,./docs/_build,./docs/_static,./_site,./.git,./build,./dist,./examples"

[tool.numpydoc_validation]
checks = [
    "all",
    "ES01", # No extended summary
    "EX01", # No examples section
    "SA01", # No See Also section
    "SA02", # Punctuation in See Also section is not that important
    "GL01", # Docstring starting on the same line as open quotes?
    "PR08", # Capitalization of parameter descriptions is not that important
    "PR09", # Punctuation of parameter descriptions is not that important
    "RT02", # It's useful to include shape descriptions in return types
    "SA04", # See Also descriptions are not that important
    "RT04", # Capitalization in return descriptions is not that important
    "RT05", # Punctuation in return descriptions is not that important
    "SS03", # Punctuation in summary is not that important
    "GL08", # @overload stubs and internal helpers do not need docstrings
    "SS01", # Module-level docstrings use autosummary format, not numpydoc
    "PR02", # We can have extra parameter names included, eg when using **kwargs
]
exclude = [
    # Exclude all private functions and classes (those beginning with _):
    "\\._",
]
exclude_files = [
    '.*/models/*/*.py',
    '.*/models/*/*/*.py'
]

[tool.hatch.envs.default]
dependency-groups = [
    "test",
    "benchmark",
]

[tool.hatch.envs.default.scripts]
bench = """
pytest tests/benchmark.py \
    -o addopts='' \
    -p no:cov \
    --benchmark-group-by=param:prefix \
    --benchmark-columns=min,mean,stddev \
    --benchmark-warmup=on \
    --benchmark-json=benchmark.json \
    --benchmark-min-rounds=5
python scripts/bench_to_md.py
"""

[tool.hatch.build.targets.wheel]
packages = ["bopp"]
force-include = { "bopp/py.typed" = "bopp/py.typed" }

[tool.hatch.envs.codegen]
# Isolate the generator dependencies from your main app
dependencies = [
  "datamodel-code-generator>=0.66.0,<0.89.0",
  "ruff",
]

[tool.hatch.envs.codegen.scripts]
# A script to wipe the old compiled models before generating new ones
clean = "rm -rf bopp/models/v1/*"

# The main generation script
compile = """
datamodel-codegen \\
  --input schemas/v1/ \\
  --input-file-type jsonschema \\
  --base-class-map '{{\"Annotation\": \"...base.BoppBase\", \"Grouping\": \"...base.GroupingBase\"}}' \\
  --output bopp/models/v1/ \\
  --output-model-type msgspec.Struct \\
  --formatters ruff-check ruff-format \\
  --target-python-version 3.13 \\
  --use-union-operator \\
  --disable-timestamp \\
  --enable-generated-header-marker \\
  --use-schema-description \\
  --use-annotated
"""

# Registry construction
register = """
python scripts/generate_registry.py \\
    --input-dir bopp/models/v1/ \\
    --output bopp/registries/v1.py \\
    --base-module ..models.v1
"""

# A convenience script to do both
build = ["clean", "compile", "register"]
