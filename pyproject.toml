[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bopp"
version = "0.1.0"
description = "Bounded Observation Payload Protocol"
dependencies = [
    "msgspec>=0.18.0",
    "pandas>=2.0.0",  # For CSV parsing
]

[project.optional-dependencies]
docs = [
    "sphinx",
    "numpydoc",
    "pydata-sphinx-theme",
    "json-schema-for-humans",
    "myst-parser",
]
test = [
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
addopts = "--cov=bopp --cov-report=term-missing"
testpaths = ["tests"]

# --- pyproject.toml ---

[tool.hatch.build.targets.wheel]
packages = ["bopp"]

[tool.hatch.envs.codegen]
# Isolate the generator dependencies from your main app
dependencies = [
  "datamodel-code-generator>=0.66.0" 
]

[tool.hatch.envs.codegen.scripts]
# A script to wipe the old compiled models before generating new ones
clean = "rm -rf bopp/models/v1/*"

# The main generation script
compile = """
datamodel-codegen \\
  --input schemas/v1/ \\
  --input-file-type jsonschema \\
  --base-class-map '{{\"Annotation\": \"bopp.base.BoppBase\"}}' \\
  --output bopp/models/v1/ \\
  --output-model-type msgspec.Struct \\
  --formatters ruff-check ruff-format \\
  --target-python-version 3.12 \\
  --use-union-operator \\
  --disable-timestamp \\
  --enable-generated-header-marker \\
  --use-schema-description \\
  --use-annotated
"""

# Registry construction
register = """
scripts/generate_registry.py \\
    --input-dir bopp/models/v1/ \\
    --output bopp/registries/v1.py \\
    --base-module bopp.models.v1
"""

# A convenience script to do both
build = ["clean", "compile", "register"]
