[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "bopp-extension-drums"
version = "0.1.0"
description = "A minimal BOPP extension package for drum transcription annotations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bopp",
    "msgspec",
]

[tool.flit.module]
name = "my_drums"

[project.entry-points."bopp_extension"]
"org.example.drums:v1" = "my_drums.models:DrumStroke"
