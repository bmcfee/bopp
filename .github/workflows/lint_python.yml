name: lint_python

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint_python:
    name: "Lint and code analysis"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.13"
            channel-priority: "flexible"
            envfile: ".github/environment-lint.yml"
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Cache conda
      uses: actions/cache@v6
      env:
        CACHE_NUMBER: 0
      with:
        path: ~/conda_pkgs_dir
        key: ${{ runner.os }}-${{ matrix.python-version }}-conda-${{ env.CACHE_NUMBER }}-${{ hashFiles( matrix.envfile ) }}
    - name: Install conda environment
      uses: conda-incubator/setup-miniconda@v4
      with: 
        auto-update-conda: false
        python-version: ${{ matrix.python-version }}
        add-pip-as-python-dependency: true
        auto-activate: false
        activate-environment: lint
        # mamba-version: "*"
        channel-priority: ${{ matrix.channel-priority }}
        environment-file: ${{ matrix.envfile }}
        conda-remove-defaults: true
        use-only-tar-bz2: false 

    - name: Conda info
      run: |
        conda info -a
        conda list

    - name: Spell check
      run: codespell

    - name: Linting check
      run: ruff check --output-format=github bopp tests

    - name: Linting check on docs
      run: ruff check --output-format=github docs

    - name: Docstring formatting check  
      run: numpydoc lint bopp/*.py bopp/*/*.py bopp/*/*/*.py bopp/*/*/*/*.py
    
    - name: Type check package
      run: python -m mypy --pretty bopp
