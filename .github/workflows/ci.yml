name: CI Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: True

jobs:
  test:
    name: >-
      Python ${{ matrix.python-version }} on ${{ matrix.os }}
      ${{ matrix.variant && format(' - {0}', matrix.variant) || '' }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.13"
            envfile: ".github/environment-min.yml"
            channel-priority: "strict"
            variant: "minimal"

          - os: ubuntu-latest
            python-version: "3.15"
            channel-priority: "strict"
            envfile: ".github/environment-ci.yml"

          - os: ubuntu-latest
            python-version: "3.15"
            channel-priority: "strict"
            envfile: ".github/environment-ci.yml"

          - os: ubuntu-24.04-arm
            python-version: "3.15"
            channel-priority: "strict"
            envfile: ".github/environment-ci.yml"

          - os: ubuntu-latest
            python-version: "3.15"
            channel-priority: "strict"
            envfile: ".github/environment-ci.yml"

          - os: macos-latest
            python-version: "3.15"
            channel-priority: "flexible"
            envfile: ".github/environment-ci.yml"

          - os: windows-latest
            python-version: "3.15"
            channel-priority: "flexible"
            envfile: ".github/environment-ci.yml"


    steps:
      - uses: actions/checkout@v7

      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: .github/environment-test.yml
          environment-name: bopp-test
          cache-environment: true

      - name: Verify json schema
        shell: bash -l {0}
        run: |
          check-jsonschema --check-metaschema schemas/*/*.json schemas/*/*/*.json

      - name: Check code generation
        shell: bash -l {0}
        run: |
          hatch run codegen:build
          git diff --exit-code

      - name: Install package
        shell: bash -l {0}
        run: |
          pip install --no-deps -e .

      - name: Run tests
        shell: bash -l {0}
        run: |
          pytest

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: bmcfee/bopp
          flags: unittests
          fail_ci_if_error: true
          verbose: true
          name: codecov-umbrella
